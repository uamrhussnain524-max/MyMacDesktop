```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mac Control Centre</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --glass: rgba(35, 39, 49, .82);
    --border: rgba(255,255,255,.15);
    --text: #fff;
    --muted: #b8bdc9;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse at 15% 20%, #4383a8 0%, transparent 42%),
      radial-gradient(ellipse at 85% 75%, #7853a6 0%, transparent 40%),
      linear-gradient(135deg, #142e4b, #171827 55%, #382a4e);
}

/* Top menu bar */
.menu-bar {
    height: 34px;
    position: fixed;
    inset: 0 0 auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 17px;
    background: rgba(15,18,26,.38);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-bottom: 1px solid rgba(255,255,255,.08);
    z-index: 10;
    font-size: 12px;
}

.menu-left, .menu-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.apple {
    font-size: 19px;
    line-height: 1;
}

.menu-item {
    cursor: pointer;
    opacity: .95;
}

.menu-item:hover {
    opacity: .65;
}

/* Notch */
.notch {
    position: fixed;
    width: 175px;
    height: 30px;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    background: #050506;
    border-radius: 0 0 17px 17px;
    z-index: 11;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 3px 12px #0003;
}

.notch-camera {
    width: 7px;
    height: 7px;
    background: #18374d;
    border: 1px solid #34516a;
    border-radius: 50%;
}

.notch-light {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #192e42;
}

/* Desktop */
.desktop {
    position: fixed;
    inset: 34px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

.welcome {
    text-shadow: 0 2px 18px #0005;
}

.welcome .big-apple {
    font-size: clamp(54px, 9vw, 95px);
    margin-bottom: 12px;
}

.welcome h1 {
    font-size: clamp(23px, 4vw, 38px);
    font-weight: 600;
    letter-spacing: -.8px;
}

.welcome p {
    margin-top: 10px;
    color: #e0e3ed;
    font-size: 14px;
}

/* Bottom dock */
.dock {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 9px 13px;
    max-width: calc(100vw - 24px);
    background: rgba(25,27,35,.58);
    border: 1px solid var(--border);
    border-radius: 21px;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow: 0 10px 35px #0003;
    z-index: 5;
}

.dock-app {
    width: clamp(34px, 5vw, 49px);
    height: clamp(34px, 5vw, 49px);
    flex-shrink: 0;
    display: grid;
    place-items: center;
    font-size: clamp(19px, 3vw, 28px);
    border-radius: 13px;
    cursor: pointer;
    transition: transform .18s;
    background: rgba(255,255,255,.12);
}

.dock-app:hover {
    transform: translateY(-6px) scale(1.08);
}

/* Control centre button */
.cc-trigger {
    position: fixed;
    right: 15px;
    bottom: 17px;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    font-size: 22px;
    border-radius: 15px;
    background: rgba(255,255,255,.16);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    cursor: pointer;
    z-index: 20;
    transition: background .2s, transform .2s;
}

.cc-trigger:hover {
    background: rgba(255,255,255,.27);
    transform: scale(1.05);
}

/* Control centre panel */
.control-centre {
    position: fixed;
    right: 14px;
    bottom: 76px;
    width: min(340px, calc(100vw - 24px));
    max-height: calc(100dvh - 100px);
    overflow: hidden;
    padding: 15px;
    border-radius: 25px;
    background: rgba(27,30,39,.88);
    border: 1px solid rgba(255,255,255,.17);
    box-shadow: 0 18px 65px rgba(0,0,0,.38);
    backdrop-filter: blur(35px) saturate(150%);
    -webkit-backdrop-filter: blur(35px) saturate(150%);
    z-index: 19;
    display: flex;
    flex-direction: column;
    gap: 11px;
    transform-origin: bottom right;
    animation: appear .2s ease-out;
}

.control-centre[hidden] {
    display: none;
}

@keyframes appear {
    from { opacity: 0; transform: scale(.92) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}

.cc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1px;
}

.cc-header h2 {
    font-size: 18px;
    font-weight: 650;
}

.close-btn {
    width: 28px;
    height: 28px;
    background: rgba(255,255,255,.1);
    color: white;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    font-size: 17px;
}

/* Connectivity */
.connectivity {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.tile {
    min-width: 0;
    min-height: 62px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
    color: white;
    background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px;
    cursor: pointer;
    transition: background .2s;
}

.tile:hover {
    background: rgba(255,255,255,.17);
}

.tile.active {
    background: #176bd6;
}

.tile-icon {
    width: 31px;
    height: 31px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.17);
    font-size: 17px;
}

.tile-text {
    min-width: 0;
}

.tile-text strong {
    display: block;
    font-size: 12px;
    font-weight: 600;
}

.tile-text small {
    display: block;
    margin-top: 3px;
    font-size: 10px;
    color: #d7dce7;
}

/* Brightness and volume */
.slider-card {
    padding: 11px 12px;
    background: rgba(255,255,255,.09);
    border-radius: 15px;
}

.slider-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 12px;
}

.slider-heading span:last-child {
    color: var(--muted);
}

input[type="range"] {
    width: 100%;
    height: 6px;
    accent-color: #fff;
    cursor: pointer;
}

/* Music */
.music-card {
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 11px;
    background: rgba(255,255,255,.09);
    border-radius: 16px;
}

.album {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #8c65d8, #367bc0);
    border-radius: 10px;
    font-size: 22px;
}

.music-info {
    flex: 1;
    min-width: 0;
}

.music-info strong {
    display: block;
    font-size: 12px;
}

.music-info small {
    display: block;
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}

.music-controls {
    display: flex;
    align-items: center;
    gap: 8px;
}

.music-controls button {
    background: none;
    border: 0;
    color: white;
    cursor: pointer;
    font-size: 17px;
}

.music-controls .play {
    width: 30px;
    height: 30px;
    background: rgba(255,255,255,.15);
    border-radius: 50%;
}

/* Profile and power */
.bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.action-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 43px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.09);
    color: white;
    font-size: 12px;
    cursor: pointer;
}

.action-btn:hover {
    background: rgba(255,255,255,.17);
}

.power-btn {
    color: #ffaaa9;
}

.footer {
    text-align: center;
    font-size: 10px;
    color: #aeb5c4;
}

/* Small screens: compact layout, no scrolling */
@media (max-height: 650px) {
    .control-centre {
        padding: 10px;
        gap: 7px;
        bottom: 68px;
        max-height: calc(100dvh - 78px);
    }

    .tile {
        min-height: 49px;
        padding: 7px;
        gap: 7px;
    }

    .tile-icon {
        width: 27px;
        height: 27px;
        font-size: 15px;
    }

    .slider-card {
        padding: 8px 10px;
    }

    .music-card {
        padding: 8px;
    }

    .album {
        width: 34px;
        height: 34px;
    }

    .action-btn {
        min-height: 36px;
    }

    .footer {
        display: none;
    }
}

@media (max-width: 450px) {
    .menu-left, .menu-right {
        gap: 8px;
    }

    .menu-bar {
        padding: 0 9px;
        font-size: 10px;
    }

    .dock {
        left: 10px;
        transform: none;
        gap: 5px;
        padding: 7px;
    }

    .cc-trigger {
        right: 10px;
        bottom: 12px;
        width: 43px;
        height: 43px;
    }

    .control-centre {
        right: 10px;
        bottom: 65px;
    }
}
</style>
</head>

<body>

<header class="menu-bar">
    <div class="menu-left">
        <span class="apple">●</span>
        <strong class="menu-item">Finder</strong>
        <span class="menu-item">File</span>
        <span class="menu-item">View</span>
    </div>

    <div class="menu-right">
        <span>◉</span>
        <span>⌕</span>
        <span id="menuDate">MON 20 OCT</span>
        <span id="menuTime">9:41 AM</span>
    </div>
</header>

<div class="notch" id="notch" title="Open Control Centre">
    <span class="notch-camera"></span>
    <span class="notch-light"></span>
</div>

<main class="desktop">
    <div class="welcome">
        <div class="big-apple"></div>
        <h1>Welcome to your desktop.</h1>
        <p>A little macOS inspiration for Windows.</p>
    </div>
</main>

<!-- Dock -->
<nav class="dock" aria-label="App dock">
    <div class="dock-app" title="Finder" onclick="showNotice('Finder')">😊</div>
    <div class="dock-app" title="Browser" onclick="showNotice('Browser')">🌐</div>
    <div class="dock-app" title="Music" onclick="toggleControl()">🎵</div>
    <div class="dock-app" title="Settings" onclick="toggleControl()">⚙️</div>
    <div class="dock-app" title="Photos" onclick="showNotice('Photos')">🖼️</div>
</nav>

<!-- Control Centre button -->
<button class="cc-trigger" id="ccTrigger"
        aria-label="Open Control Centre"
        aria-expanded="false"
        title="Control Centre">☷</button>

<!-- Control Centre -->
<section class="control-centre" id="controlCentre" hidden>
    <div class="cc-header">
        <h2>Control Centre</h2>
        <button class="close-btn" id="closeControl" aria-label="Close">×</button>
    </div>

    <div class="connectivity">
        <button class="tile active" data-toggle="wifi">
            <span class="tile-icon">◔</span>
            <span class="tile-text">
                <strong>Wi-Fi</strong>
                <small>Connected</small>
            </span>
        </button>

        <button class="tile" data-toggle="bluetooth">
            <span class="tile-icon">ᛒ</span>
            <span class="tile-text">
                <strong>Bluetooth</strong>
                <small>Off</small>
            </span>
        </button>

        <button class="tile active" data-toggle="airplane">
            <span class="tile-icon">✈</span>
            <span class="tile-text">
                <strong>Airplane</strong>
                <small>Off</small>
            </span>
        </button>

        <button class="tile" data-toggle="focus">
            <span class="tile-icon">☾</span>
            <span class="tile-text">
                <strong>Focus</strong>
                <small>Off</small>
            </span>
        </button>
    </div>

    <div class="slider-card">
        <div class="slider-heading">
            <span>☀ Brightness</span>
            <span id="brightnessValue">80%</span>
        </div>
        <input id="brightness" type="range" min="10" max="100" value="80">
    </div>

    <div class="slider-card">
        <div class="slider-heading">
            <span>🔊 Volume</span>
            <span id="volumeValue">60%</span>
        </div>
        <input id="volume" type="range" min="0" max="100" value="60">
    </div>

    <div class="music-card">
        <div class="album">♫</div>
        <div class="music-info">
            <strong id="trackName">Now Playing</strong>
            <small id="trackStatus">Your music controls</small>
        </div>
        <div class="music-controls">
            <button id="previousTrack" aria-label="Previous track">◀</button>
            <button class="play" id="playTrack" aria-label="Play or pause">▶</button>
            <button id="nextTrack" aria-label="Next track">▶</button>
        </div>
    </div>

    <div class="bottom-row">
        <button class="action-btn" id="profileButton">👤 Profile</button>
        <button class="action-btn power-btn" id="powerButton">⏻ Power</button>
    </div>

    <div class="footer">Your personal Control Centre</div>
</section>

<script>
const panel = document.getElementById("controlCentre");
const trigger = document.getElementById("ccTrigger");
const notch = document.getElementById("notch");

function toggleControl() {
    panel.hidden = !panel.hidden;
    trigger.setAttribute("aria-expanded", String(!panel.hidden));
}

function closeControl() {
    panel.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
}

trigger.addEventListener("click", toggleControl);
notch.addEventListener("click", toggleControl);
document.getElementById("closeControl").addEventListener("click", closeControl);

document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeControl();
});

document.querySelectorAll("[data-toggle]").forEach(button => {
    button.addEventListener("click", () => {
        const enabled = button.classList.toggle("active");
        const label = button.querySelector("small");
        label.textContent = enabled ? "On" : "Off";
    });
});

const brightness = document.getElementById("brightness");
const volume = document.getElementById("volume");

brightness.addEventListener("input", () => {
    document.getElementById("brightnessValue").textContent =
        brightness.value + "%";
    document.body.style.filter =
        `brightness(${0.5 + Number(brightness.value) / 200})`;
});

volume.addEventListener("input", () => {
    document.getElementById("volumeValue").textContent =
        volume.value + "%";
});

let playing = false;

document.getElementById("playTrack").addEventListener("click", () => {
    playing = !playing;
    document.getElementById("playTrack").textContent =
        playing ? "Ⅱ" : "▶";
    document.getElementById("trackStatus").textContent =
        playing ? "Playing state preview" : "Your music controls";
});

document.getElementById("previousTrack").addEventListener("click", () => {
    document.getElementById("trackName").textContent = "Previous Track";
});

document.getElementById("nextTrack").addEventListener("click", () => {
    document.getElementById("trackName").textContent = "Next Track";
});

document.getElementById("profileButton").addEventListener("click", () => {
    showNotice("Profile button clicked");
});

document.getElementById("powerButton").addEventListener("click", () => {
    showNotice("For safety, shut down Windows using the Start menu.");
});

function showNotice(message) {
    document.getElementById("trackName").textContent = message;
    document.getElementById("trackStatus").textContent =
        "Interface preview";
    if (panel.hidden) toggleControl();
}

function updateClock() {
    const now = new Date();

    document.getElementById("menuTime").textContent =
        now.toLocaleTimeString([], {
            hour: "numeric",
            minute: "2-digit"
        });

    document.getElementById("menuDate").textContent =
        now.toLocaleDateString("en-US", {
            weekday: "short",
            day: "numeric",
            month: "short"
        }).toUpperCase();
}

updateClock();
setInterval(updateClock, 15000);
</script>

</body>
</html>
```
